tools:
  - name: inspect_project
    description: Return Godot version, project path, current scene, and main scene. Use before authoring project files. Not for scene-tree details; use inspect_scene.
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    source_file: scripts/inspect_project.py
    next-tools:
      on-success: [godot_project__write_script, godot_scene__inspect_scene]
      on-failure: [dcc_diagnostics__screenshot, dcc_diagnostics__audit_log]
  - name: write_script
    description: Write one bounded GDScript file below res:// without executing it. Use for typed project code generation. Not for arbitrary files or runtime evaluation.
    input_schema:
      type: object
      required: [path, source]
      properties:
        path: {type: string, pattern: "^res://.*\\.gd$", maxLength: 300}
        source: {type: string, maxLength: 100000}
        overwrite: {type: boolean, default: false}
      additionalProperties: false
    output_schema: {type: object}
    read_only: false
    destructive: true
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    source_file: scripts/write_script.py
    next-tools:
      on-success: [godot_project__inspect_project, godot_scene__inspect_scene]
      on-failure: [dcc_diagnostics__screenshot, dcc_diagnostics__audit_log]
