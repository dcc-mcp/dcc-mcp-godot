tools:
  - name: install_combat_vfx_library
    description: "Install portable attack, spell, and aura scenes with a combat VFX gallery. Parameters are validated again by the Godot host."
    input_schema: {"type":"object","properties":{"directory":{"type":"string","pattern":"^res://","maxLength":500,"default":"res://combat_vfx"}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: create_combat_vfx
    description: "Add a configurable slash, impact, or persistent magic aura to a 3D scene. Parameters are validated again by the Godot host."
    input_schema: {"type":"object","properties":{"parent_path":{"type":"string","maxLength":500,"default":"."},"name":{"type":"string","minLength":1,"maxLength":100},"tint":{"type":"string","pattern":"^#[0-9a-fA-F]{6}$","default":"#ff6018"},"effect":{"type":"string","enum":["slash","impact","aura"],"default":"aura"},"radius":{"type":"number","minimum":0.1,"maximum":20,"default":1.5},"duration":{"type":"number","minimum":0.05,"maximum":10,"default":0.6},"autoplay":{"type":"boolean","default":true},"auto_free":{"type":"boolean","default":false}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: create_dynamic_fire_vfx
    description: "Create billowing 3D fire particles, sparks, and a colored light. Parameters are validated again by the Godot host."
    input_schema: {"type":"object","properties":{"parent_path":{"type":"string","maxLength":500,"default":"."},"name":{"type":"string","minLength":1,"maxLength":100},"tint":{"type":"string","pattern":"^#[0-9a-fA-F]{6}$","default":"#ff6018"},"amount":{"type":"integer","minimum":8,"maximum":256,"default":48},"texture_path":{"type":"string","pattern":"^res://","maxLength":500}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: create_spell_projectile
    description: "Create an inert fire projectile with travel, impact, and cleanup. Parameters are validated again by the Godot host."
    input_schema: {"type":"object","properties":{"parent_path":{"type":"string","maxLength":500,"default":"."},"name":{"type":"string","minLength":1,"maxLength":100},"tint":{"type":"string","pattern":"^#[0-9a-fA-F]{6}$","default":"#ff6018"},"speed":{"type":"number","minimum":0.1,"maximum":100,"default":8.0},"lifetime":{"type":"number","minimum":0.1,"maximum":30,"default":4.0}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: create_spellcasting_demo
    description: "Install a portable mage casting demo in a new project folder. Parameters are validated again by the Godot host."
    input_schema: {"type":"object","properties":{"directory":{"type":"string","pattern":"^res://","maxLength":500,"default":"res://spell_vfx"},"mage_path":{"type":"string","pattern":"^res://","maxLength":500},"tint":{"type":"string","pattern":"^#[0-9a-fA-F]{6}$","default":"#ff6018"},"auto_cast":{"type":"boolean","default":true}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
