tools:
  - name: setup_physics_body
    description: Configure physics-body properties. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500},"parent_path":{"type":"string","maxLength":500},"name":{"type":"string","maxLength":500},"is_3d":{"type":"boolean"},"shape":{"type":"string","maxLength":500},"properties":{"type":"object"},"shape_properties":{"type":"object"},"layer":{"type":"integer","minimum":0},"mask":{"type":"integer","minimum":0}},"additionalProperties":true}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
