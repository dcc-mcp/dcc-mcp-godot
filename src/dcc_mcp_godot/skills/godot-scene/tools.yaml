tools:
  - name: inspect_scene
    description: Return the current scene tree up to eight levels deep. Use before choosing node paths. Not for project metadata; use inspect_project.
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    source_file: scripts/inspect_scene.py
    next-tools:
      on-success: [godot_scene__create_node, godot_scene__set_property]
      on-failure: [dcc_diagnostics__screenshot, dcc_diagnostics__audit_log]
  - name: create_node
    description: Create an undoable Godot node below the current scene root. Use after inspecting the target parent. Not for script resources; use write_script.
    input_schema:
      type: object
      required: [type, name]
      properties:
        type: {type: string, minLength: 1, maxLength: 100}
        name: {type: string, minLength: 1, maxLength: 100}
        parent_path: {type: string, default: "", maxLength: 300}
      additionalProperties: false
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    source_file: scripts/create_node.py
    next-tools:
      on-success: [godot_scene__set_property, godot_scene__save_scene]
      on-failure: [dcc_diagnostics__screenshot, dcc_diagnostics__audit_log]
  - name: set_property
    description: Set one existing node property through Godot undo/redo. Use after inspecting the node path and property. Not for creating nodes; use create_node.
    input_schema:
      type: object
      required: [node_path, property, value]
      properties:
        node_path: {type: string, maxLength: 300}
        property: {type: string, minLength: 1, maxLength: 100}
        value: {}
      additionalProperties: false
    output_schema: {type: object}
    read_only: false
    destructive: true
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    source_file: scripts/set_property.py
    next-tools:
      on-success: [godot_scene__save_scene, godot_scene__inspect_scene]
      on-failure: [dcc_diagnostics__screenshot, dcc_diagnostics__audit_log]
  - name: save_scene
    description: Save the currently edited Godot scene. Use after verified node mutations. Not for project settings or script files.
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    read_only: false
    destructive: true
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    source_file: scripts/save_scene.py
    next-tools:
      on-success: [godot_scene__inspect_scene]
      on-failure: [dcc_diagnostics__screenshot, dcc_diagnostics__audit_log]
