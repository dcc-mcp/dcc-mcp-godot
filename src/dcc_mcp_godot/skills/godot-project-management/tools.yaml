tools:
  - name: get_project_info
    description: Return project metadata, version, viewport, and autoloads. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"path":{"type":"string","pattern":"^res://","maxLength":500},"query":{"type":"string","maxLength":500},"extension":{"type":"string","maxLength":500},"extensions":{"type":"array","items":{"type":"string","maxLength":500}},"key":{"type":"string","maxLength":500},"prefix":{"type":"string","maxLength":500},"value":{},"uid":{"type":"string","maxLength":500}},"additionalProperties":true}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
