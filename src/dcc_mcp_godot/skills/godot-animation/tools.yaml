tools:
  - name: list_animations
    description: "List AnimationPlayer libraries and animations. Parameters are validated again by the Godot host."
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500},"animation":{"type":"string","maxLength":500},"name":{"type":"string","maxLength":500},"library":{"type":"string","maxLength":500},"length":{"type":"number","exclusiveMinimum":0},"track":{"type":"integer","minimum":0},"track_type":{"type":"string","maxLength":500},"property_path":{"type":"string","maxLength":500},"time":{"type":"number","minimum":0},"value":{},"transition":{"type":"number"}},"additionalProperties":true}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: create_animation
    description: "Create an animation in an AnimationPlayer. Parameters are validated again by the Godot host."
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500},"animation":{"type":"string","maxLength":500},"name":{"type":"string","maxLength":500},"library":{"type":"string","maxLength":500},"length":{"type":"number","exclusiveMinimum":0},"track":{"type":"integer","minimum":0},"track_type":{"type":"string","maxLength":500},"property_path":{"type":"string","maxLength":500},"time":{"type":"number","minimum":0},"value":{},"transition":{"type":"number"}},"additionalProperties":true}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: add_animation_track
    description: "Add a typed animation track. Parameters are validated again by the Godot host."
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500},"animation":{"type":"string","maxLength":500},"name":{"type":"string","maxLength":500},"library":{"type":"string","maxLength":500},"length":{"type":"number","exclusiveMinimum":0},"track":{"type":"integer","minimum":0},"track_type":{"type":"string","maxLength":500},"property_path":{"type":"string","maxLength":500},"time":{"type":"number","minimum":0},"value":{},"transition":{"type":"number"}},"additionalProperties":true}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: set_animation_keyframe
    description: "Insert a typed animation key with optional easing. Parameters are validated again by the Godot host."
    input_schema: {"type":"object","required":["animation","track","value"],"properties":{"node_path":{"type":"string","maxLength":500},"animation":{"type":"string","maxLength":500},"name":{"type":"string","maxLength":500},"library":{"type":"string","maxLength":500},"length":{"type":"number","exclusiveMinimum":0},"track":{"type":"integer","minimum":0},"track_type":{"type":"string","maxLength":500},"property_path":{"type":"string","maxLength":500},"time":{"type":"number","minimum":0},"value":{"description":"Payload follows the existing track type. 3D position/scale use exactly three finite numbers; rotation uses a finite unit quaternion [x,y,z,w] without normalization. Audio uses an object with stream_path and optional non-negative start_offset/end_offset, and requires a native wav/ogg/mp3 already imported and held in the editor resource cache. No resource is loaded by this call. Other track payloads keep their native semantics."},"transition":{"type":"number"}},"additionalProperties":true}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: get_animation_info
    description: "Return animation tracks and keys. Parameters are validated again by the Godot host."
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500},"animation":{"type":"string","maxLength":500},"name":{"type":"string","maxLength":500},"library":{"type":"string","maxLength":500},"length":{"type":"number","exclusiveMinimum":0},"track":{"type":"integer","minimum":0},"track_type":{"type":"string","maxLength":500},"property_path":{"type":"string","maxLength":500},"time":{"type":"number","minimum":0},"value":{},"transition":{"type":"number"}},"additionalProperties":true}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: remove_animation
    description: "Remove an animation from a library. Parameters are validated again by the Godot host."
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500},"animation":{"type":"string","maxLength":500},"name":{"type":"string","maxLength":500},"library":{"type":"string","maxLength":500},"length":{"type":"number","exclusiveMinimum":0},"track":{"type":"integer","minimum":0},"track_type":{"type":"string","maxLength":500},"property_path":{"type":"string","maxLength":500},"time":{"type":"number","minimum":0},"value":{},"transition":{"type":"number"}},"additionalProperties":true}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
