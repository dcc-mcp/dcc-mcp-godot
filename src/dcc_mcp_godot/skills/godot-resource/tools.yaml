tools:
  - name: read_resource
    description: Load and serialize a resource property summary. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"path":{"type":"string","pattern":"^res://","maxLength":500},"type":{"type":"string","maxLength":500},"properties":{"type":"object"},"name":{"type":"string","maxLength":500}},"additionalProperties":true}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: edit_resource
