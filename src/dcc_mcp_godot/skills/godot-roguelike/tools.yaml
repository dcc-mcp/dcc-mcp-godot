tools:
  - name: create_2d_roguelike
    description: Install a playable, asset-free 2D arena roguelike and set it as the main scene. Use for a complete prototype. Not for editing an existing scene.
    input_schema:
      type: object
      properties:
        title: {type: string, default: "DCC-MCP Roguelike", minLength: 1, maxLength: 100}
      additionalProperties: false
    output_schema: {type: object}
    read_only: false
    destructive: true
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/create_2d_roguelike.py
    next-tools:
      on-success: [godot_roguelike__validate_2d_roguelike]
      on-failure: [dcc_diagnostics__screenshot, dcc_diagnostics__audit_log]
  - name: validate_2d_roguelike
    description: Validate the generated scene, scripts, smoke runner, and gameplay contract. Use after create_2d_roguelike. Not for arbitrary Godot projects.
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    source_file: scripts/validate_2d_roguelike.py
    next-tools:
      on-success: [godot_project__inspect_project]
      on-failure: [dcc_diagnostics__screenshot, dcc_diagnostics__audit_log]
