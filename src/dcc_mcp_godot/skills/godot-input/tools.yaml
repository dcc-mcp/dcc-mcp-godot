    input_schema: {"type":"object","properties":{"action":{"type":"string","maxLength":500},"pressed":{"type":"boolean"},"strength":{"type":"number"},"keycode":{"type":"integer"},"position":{"type":"array","items":{"type":"number"},"minItems":2,"maxItems":4},"relative":{"type":"array","items":{"type":"number"},"minItems":2,"maxItems":4},"button":{"type":"integer"},"events":{"type":"array","items":{"type":"object"},"maxItems":100},"deadzone":{"type":"number","minimum":0,"maximum":1},"replace_events":{"type":"boolean"}},"additionalProperties":true}
