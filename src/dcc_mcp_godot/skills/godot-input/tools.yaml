    source_file: scripts/dispatch.py
  - name: get_input_actions
    description: "List editor InputMap or explicitly selected project input actions. Parameters are validated again by the Godot host."
    input_schema: {"type":"object","properties":{"source":{"type":"string","enum":["editor","project"],"default":"editor"}},"additionalProperties":false}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: set_input_action
    description: "Update an editor input action, or explicitly persist one project binding. Parameters are validated again by the Godot host."
    input_schema: {"type":"object","properties":{"action":{"type":"string","minLength":1,"maxLength":500},"keycode":{"type":"integer","minimum":1,"maximum":8388606,"description":"Known raw Godot Key constant, e.g. KEY_A=65. Host rejects enum holes, lowercase ASCII and modifier masks."},"deadzone":{"type":"number","minimum":0,"maximum":1},"replace_events":{"type":"boolean","default":false},"persist":{"type":"boolean","default":false}},"additionalProperties":false,"required":["action"]}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
