tools:
  - name: run_test_scenario
    description: Run a sequence of runtime actions and assertions. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"node_path":{"type":"string","maxLength":500},"steps":{"type":"array","items":{"type":"object"},"maxItems":100},"equals":{"type":"object"},"text":{"type":"string","maxLength":500},"first":{"type":"string","pattern":"^res://","maxLength":500},"second":{"type":"string","pattern":"^res://","maxLength":500},"threshold":{"type":"number","minimum":0,"maximum":1},"frames":{"type":"integer","minimum":1,"maximum":120}},"additionalProperties":true}
    output_schema: {type: object}
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
