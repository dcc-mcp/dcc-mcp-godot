tools:
  - name: get_performance_monitors
    description: Return runtime Performance monitor values. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{},"additionalProperties":true}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: get_editor_performance
    description: Return editor process memory and frame summary. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{},"additionalProperties":true}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
