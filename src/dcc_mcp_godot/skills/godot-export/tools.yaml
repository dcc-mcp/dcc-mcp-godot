tools:
  - name: list_export_presets
    description: "List project export presets without secrets. Parameters are validated again by the Godot host."
    input_schema: {"type":"object","properties":{"preset":{"type":"string","maxLength":500},"path":{"type":"string","maxLength":500},"debug":{"type":"boolean"}},"additionalProperties":true}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: export_project
    description: "Compatibility synchronous export; prefer start_export_job for observable long exports. Parameters are validated again by the Godot host."
    input_schema: {"type":"object","properties":{"preset":{"type":"string","maxLength":500},"path":{"type":"string","maxLength":500},"debug":{"type":"boolean"}},"additionalProperties":true}
    output_schema: {type: object}
    read_only: false
    destructive: true
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: start_export_job
    description: "Start or query an idempotently identified owned export child without blocking the editor. Parameters are validated by the adapter export-job contract."
    input_schema: {"type":"object","additionalProperties":false,"required":["preset","path","request_id"],"properties":{"preset":{"type":"string","minLength":1,"maxLength":500},"path":{"type":"string","minLength":1,"maxLength":500},"request_id":{"type":"string","pattern":"^[0-9a-f]{32}$"},"debug":{"type":"boolean","default":false},"timeout_seconds":{"type":"integer","minimum":5,"maximum":1800,"default":600}}}
    output_schema: {type: object}
    read_only: false
    destructive: true
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: get_export_job
    description: "Read bounded export lifecycle state and complete log/output manifest receipts. Parameters are validated by the adapter export-job contract."
    input_schema: {"type":"object","additionalProperties":false,"required":["job_id"],"properties":{"job_id":{"type":"string","pattern":"^[0-9a-f]{32}$"}}}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: cancel_export_job
    description: "Cancel only this adapter-owned export child and report actual cleanup state. Parameters are validated by the adapter export-job contract."
    input_schema: {"type":"object","additionalProperties":false,"required":["job_id"],"properties":{"job_id":{"type":"string","pattern":"^[0-9a-f]{32}$"}}}
    output_schema: {type: object}
    read_only: false
    destructive: true
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: get_export_info
    description: "Return export configuration and template availability. Parameters are validated again by the Godot host."
    input_schema: {"type":"object","properties":{"preset":{"type":"string","maxLength":500},"path":{"type":"string","maxLength":500},"debug":{"type":"boolean"}},"additionalProperties":true}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
