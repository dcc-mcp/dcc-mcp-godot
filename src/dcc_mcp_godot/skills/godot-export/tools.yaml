tools:
  - name: list_export_presets
    description: List project export presets without secrets. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"preset":{"type":"string","maxLength":500},"path":{"type":"string","maxLength":500},"debug":{"type":"boolean"}},"additionalProperties":true}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: export_project
    description: Export a project using a named preset and safe project path. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"preset":{"type":"string","maxLength":500},"path":{"type":"string","maxLength":500},"debug":{"type":"boolean"}},"additionalProperties":true}
    output_schema: {type: object}
    read_only: false
    destructive: true
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
  - name: get_export_info
    description: Return export configuration and template availability. Parameters are validated again by the Godot host.
    input_schema: {"type":"object","properties":{"preset":{"type":"string","maxLength":500},"path":{"type":"string","maxLength":500},"debug":{"type":"boolean"}},"additionalProperties":true}
    output_schema: {type: object}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    source_file: scripts/dispatch.py
