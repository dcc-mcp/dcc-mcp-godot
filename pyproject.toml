[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-godot"
version = "0.7.1"
description = "Godot Engine adapter and 2D game-authoring skills for DCC-MCP"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "loonghao", email = "hal.long@outlook.com" }]
keywords = ["godot", "mcp", "game-development", "ai", "model-context-protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
]
dependencies = ["dcc-mcp-core>=0.19.45,<1.0.0", "websockets>=12"]

[project.urls]
Homepage = "https://github.com/dcc-mcp/dcc-mcp-godot"
Repository = "https://github.com/dcc-mcp/dcc-mcp-godot"
Issues = "https://github.com/dcc-mcp/dcc-mcp-godot/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.8", "twine>=6"]

[project.scripts]
dcc-mcp-godot = "dcc_mcp_godot.cli:main"
dcc-mcp-godot-install = "dcc_mcp_godot.install:main"

[project.entry-points."dcc_mcp.adapters"]
godot = "dcc_mcp_godot:GodotMcpServer"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_godot"]
artifacts = ["src/dcc_mcp_godot/skills/**", "src/dcc_mcp_godot/godot_addon/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
