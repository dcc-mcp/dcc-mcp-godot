name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "release-please--branches--**"]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.12"]
        exclude:
          - os: windows-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  lint-build:
    name: Lint, skill contracts, and package build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_main_thread_budget_contract.py
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - uses: actions/checkout@v6
        with:
          repository: dcc-mcp/dcc-mcp-agent-plugins
          ref: 54b9d46a9fcefab1ed3a6aafc18da6ab4198ad25
          path: .agent-plugins
      - name: Check Agent quickstart
        run: >-
          python .agent-plugins/scripts/sync_adapter_readme.py
          --repository ${{ github.event.repository.name }}
          --readme README.md
          --check
      - run: python tools/lint_skills.py
      - run: python -m pip install "hatchling==1.32.0" build twine
      - run: python -m build --no-isolation
      - run: python -m twine check dist/*

  godot-latest:
    name: Latest stable Godot / real editor and gameplay smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DCC_MCP_LOG_LEVEL: WARN
      DCC_MCP_DISABLE_FILE_LOGGING: "1"
      DCC_MCP_DISABLE_JOB_PERSISTENCE: "1"
      DCC_MCP_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - id: godot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "path=$(python tools/download_latest_godot.py --output .godot-bin)" >> "$GITHUB_OUTPUT"
      # The smoke test writes engine stderr to a log but never asserts on it, so
      # a GDScript that fails to parse can still show up as a green run. Compile
      # every shipped script first: default project settings treat GDScript
      # warnings as errors, so this also pins that contract.
      - name: Compile bundled GDScript
        shell: bash
        run: |
          set -euo pipefail
          # The smoke test writes engine stderr to a log but never asserts on
          # it, so a GDScript that fails to parse can still look like a green
          # run. Compile each script against a default project: Godot treats
          # GDScript warnings as errors there, which is what pins this contract.
          # Each script is copied to the project root because Godot does NOT
          # apply that treatment to scripts under addons/, and the addons tree
          # is copied alongside it so res://addons/... preloads still resolve.
          tmp=$(mktemp -d)
          printf 'config_version=5\n\n[application]\nconfig/name="gdscript-check"\n' > "$tmp/project.godot"
          cp -r src/dcc_mcp_godot/godot_addon/addons "$tmp/addons"
          status=0
          while IFS= read -r script; do
            cp "$script" "$tmp/check.gd"
            if ! "${{ steps.godot.outputs.path }}" --headless --path "$tmp" --check-only --script check.gd; then
              echo "::error file=$script::GDScript failed to compile"
              status=1
            fi
          done < <(find src -name '*.gd' | sort)
          exit $status
      - run: python tests/live_godot_smoke.py --godot "${{ steps.godot.outputs.path }}"
      # Scene previews need a windowed host: under --headless the engine drops
      # to rendering/dummy and the host refuses the capability by design, so the
      # smoke above never reaches it. This lane starts a windowed editor on a
      # throwaway Xvfb display and calls render_scene_preview for real.
      - name: Install Xvfb for the windowed preview lane
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            echo "xvfb-run is already installed"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          fi
      - name: Probe windowed render_scene_preview
        id: preview_probe
        env:
          # Software rasterisation: there is no GPU on the runner, and a failed
          # GLX context would silently degrade the renderer instead of failing.
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" \
            python tests/probe_windowed_preview.py \
              --godot "${{ steps.godot.outputs.path }}" \
              --out preview-probe --tier B
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # The gate below decides: 2 means "not measured", which must not
          # become a permanent red, and must not be reported as a pass either.
          exit 0
      - name: Report windowed preview probe
        if: always()
        run: |
          if [ -f preview-probe/summary.md ]; then
            cat preview-probe/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "windowed preview probe produced no summary" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload windowed preview probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windowed-preview-probe
          path: preview-probe
          if-no-files-found: warn
      - name: Gate windowed preview probe
        if: always()
        run: |
          code="${{ steps.preview_probe.outputs.exit_code }}"
          if [ "$code" = "1" ]; then
            echo "::error::render_scene_preview produced a frame that failed the tier B criteria"
            exit 1
          fi
          if [ "$code" = "2" ]; then
            echo "::warning::windowed scene preview was not measured on this platform; assertions skipped"
          fi
