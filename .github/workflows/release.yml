name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Require organization release token
        shell: bash
        env:
          RELEASE_PR_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          if [ -z "${RELEASE_PR_TOKEN:-}" ]; then
            echo "::error::Organization PERSONAL_ACCESS_TOKEN is unavailable; release automation cannot continue."
            exit 1
          fi
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dcc-mcp-godot
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine && python -m build && python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  asset-store-package:
    name: Build Godot Asset Store package
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build deterministic addon archive
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.release-please.outputs.tag_name }}'
          version="${tag#v}"
          python tools/build_asset_store_package.py \
            --output "dist/dcc-mcp-godot-${version}.zip"
          sha256sum "dist/dcc-mcp-godot-${version}.zip" \
            > "dist/dcc-mcp-godot-${version}.zip.sha256"
      - name: Upload package to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ needs.release-please.outputs.tag_name }}'
          version="${tag#v}"
          gh release upload "$tag" \
            "dist/dcc-mcp-godot-${version}.zip" \
            "dist/dcc-mcp-godot-${version}.zip.sha256" \
            --repo "${{ github.repository }}" \
            --clobber
