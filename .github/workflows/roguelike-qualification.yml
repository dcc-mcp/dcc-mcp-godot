name: Roguelike qualification

on:
  pull_request:
    paths:
      - "src/dcc_mcp_godot/godot_addon/addons/dcc_mcp_godot/commands.gd"
      - "src/dcc_mcp_godot/godot_addon/addons/dcc_mcp_godot/templates/roguelike/**"
      - "src/dcc_mcp_godot/skills/godot-roguelike/**"
      - "tests/probe_roguelike_qualification.py"
      - "tests/test_roguelike_qualification.py"
      - ".github/workflows/roguelike-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roguelike-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install browser probe
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.63.0"
          python -m playwright install --with-deps chromium
      - name: Fetch pinned Godot and official export templates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/roguelike-native"
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o "$RUNNER_TEMP/roguelike-native/engine.zip"
          echo "d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3  $RUNNER_TEMP/roguelike-native/engine.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/roguelike-native/engine.zip" -d "$RUNNER_TEMP/roguelike-native"
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz -o "$RUNNER_TEMP/roguelike-native/templates.tpz"
          unzip -p "$RUNNER_TEMP/roguelike-native/templates.tpz" templates/linux_release.x86_64.zip > "$RUNNER_TEMP/roguelike-native/linux_release.x86_64.zip"
          unzip -q "$RUNNER_TEMP/roguelike-native/linux_release.x86_64.zip" -d "$RUNNER_TEMP/roguelike-native/linux-template"
          unzip -p "$RUNNER_TEMP/roguelike-native/templates.tpz" templates/web_nothreads_release.zip > "$RUNNER_TEMP/roguelike-native/web_nothreads_release.zip"
      - name: Run native, desktop, and Web qualification
        run: |
          python tests/probe_roguelike_qualification.py \
            --godot "$RUNNER_TEMP/roguelike-native/Godot_v4.6.3-stable_linux.x86_64" \
            --output "$RUNNER_TEMP/roguelike-qualification" \
            --desktop-preset "Linux/X11" \
            --desktop-platform "Linux/X11" \
            --desktop-template "$RUNNER_TEMP/roguelike-native/linux-template/linux_release.x86_64" \
            --web-template "$RUNNER_TEMP/roguelike-native/web_nothreads_release.zip"
      - name: Publish qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roguelike-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: ${{ runner.temp }}/roguelike-qualification
